name: Test movie intel
on:
  push:
    branches: [movie-intel]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_movie_intel.py test_movie_intel_service.py
