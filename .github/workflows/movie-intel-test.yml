name: Test production movie intel
on:
  push:
    branches: [main, movie-intel, production/d016-qualification, production/radarr-movie-list-sync, production/radarr-snapshot-bridge, production/watched-tagging]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest -v
      - run: python production_scoring.py --check
