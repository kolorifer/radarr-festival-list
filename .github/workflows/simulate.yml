name: Simulate backcatalog scoring

on:
  workflow_dispatch:
  push:
    branches: [main, simulation-4-multi-route, simulation-4b-union-universe]
    paths:
      - simulate_scoring.py
      - evidence_score.py
      - evidence_sources.py
      - evidence_sources_run.py
      - evidence_sources_extra.py
      - evidence_calibration.py
      - score_band_analysis.py
      - score_rule_experiment.py
      - candidate_review_report.py
      - rating_source_audit.py
      - critical_consensus_experiment.py
      - test_audience_discovery.py
      - test_evidence_score.py
      - test_evidence_sources.py
      - test_evidence_sources_extra.py
      - test_score_rule_experiment.py
      - phase_b_sources.py
      - requirements.txt
      - audience-ratings.json
      - sources/imdb-audience-discovery.json
      - sources/phase-b-institutional.json
      - .github/workflows/simulate.yml

permissions:
  contents: write

concurrency:
  group: scoring-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase B dependencies
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python -m pip install -r requirements.txt
      - name: Build Phase B institutional universe
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python phase_b_sources.py
      - name: Run research scoring simulation
        run: |
          python simulate_scoring.py
          python - <<'PY'
          import json
          rows=json.load(open('simulation-promoted.json'))
          with open('simulation-promoted-titles.txt','w') as f:
              for i,r in enumerate(rows,1):
                  rank = r['rank'] if r['rank'] is not None else 'OUT'
                  f.write(f"{i:02d}\t{rank}\t{r['year']}\t{r['title']}\t{','.join(r['routes'])}\n")
          PY
      - name: Build evidence-family source snapshot
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python evidence_sources_run.py
      - name: Test and build normalized evidence scores
        if: github.ref_name == 'simulation-4b-union-universe'
        run: |
          python -m unittest -v test_audience_discovery.py test_evidence_sources.py test_evidence_sources_extra.py test_evidence_score.py test_score_rule_experiment.py
          python evidence_score.py
      - name: Print calibration controls
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python evidence_calibration.py
      - name: Analyze score bands
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python score_band_analysis.py
      - name: Compare score-driven selection rules
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python score_rule_experiment.py
      - name: Build candidate review report
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python candidate_review_report.py
      - name: Audit cached rating sources
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python rating_source_audit.py
      - name: Test broad critic consensus
        if: github.ref_name == 'simulation-4b-union-universe'
        run: python critical_consensus_experiment.py
      - name: Commit simulation
        run: |
          git add scoring-simulation.json simulation-qualifiers.json simulation-promoted.json simulation-promoted-titles.txt simulation-phase-b-new.json
          if [ "${GITHUB_REF_NAME}" = "simulation-4b-union-universe" ]; then git add sources/phase-b-institutional.json sources/evidence-families.json evidence-scores.json score-band-analysis.json score-rule-experiment.json candidate-review.md rating-source-audit.json critical-consensus-experiment.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git commit -m "Update Phase B simulation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
