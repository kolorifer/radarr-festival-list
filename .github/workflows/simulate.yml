name: Simulate backcatalog scoring

on:
  workflow_dispatch:
  push:
    branches: [main, simulation-4-multi-route]
    paths:
      - simulate_scoring.py
      - audience-ratings.json
      - .github/workflows/simulate.yml

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run research scoring simulation
        run: |
          python simulate_scoring.py
          python - <<'PY'
          import json
          rows=json.load(open('simulation-promoted.json'))
          with open('simulation-promoted-titles.txt','w') as f:
              for i,r in enumerate(rows,1):
                  f.write(f"{i:02d}\t{r['rank']}\t{r['year']}\t{r['title']}\t{','.join(r['routes'])}\n")
          PY
      - name: Commit simulation
        run: |
          git add scoring-simulation.json simulation-qualifiers.json simulation-promoted.json simulation-promoted-titles.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git commit -m "Update scoring simulation"
          git push
