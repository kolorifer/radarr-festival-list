name: Collect audience ratings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect ReelDB ratings
        env:
          REELDB_API_KEY: ${{ secrets.REELDB_API_KEY }}
        run: python audience_ratings.py

      - name: Commit ratings
        run: |
          git add audience-ratings.json

          if git diff --cached --quiet; then
            echo "No audience-rating changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"

          git commit -m "Update audience ratings"
          git push
