name: Update festival list

on:
  workflow_dispatch:
  schedule:
    # IMDb's list changes slowly; twice daily is plenty.
    - cron: "17 5,17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Radarr list
        run: python festival.py

      - name: Commit changes
        run: |
          if git diff --quiet -- festival.json; then
            echo "No festival list changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add festival.json
          git commit -m "Update festival list"
          git push
