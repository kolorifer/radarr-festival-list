name: Update festival lists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - festival.py
      - curated.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    - cron: "17 5,17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build IMDb festival list
        run: python festival.py

      - name: Build scored curated list
        run: python curated.py

      - name: Commit changes
        run: |
          git add festival.json curated.json curated-details.json
          if git diff --cached --quiet; then
            echo "No list changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update festival lists"
          git push
