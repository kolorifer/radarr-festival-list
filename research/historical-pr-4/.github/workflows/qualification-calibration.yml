name: Qualification calibration
on:
  push:
    branches: [research/qualification-calibration]
    paths:
      - .github/workflows/qualification-calibration.yml
      - qualification_calibration.py
      - qualification-calibration-config.json
      - test_qualification_calibration.py
permissions:
  contents: write
concurrency:
  group: qualification-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Verify frozen baseline and policy invariants
        run: |
          python -m unittest -v
          python -m pip check
      - name: Generate offline research calibration
        run: python qualification_calibration.py
      - name: Commit only calibration artifacts
        run: |
          git add simulations/qualification-calibration
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git commit -m "Generate research Evidence Score qualification calibration"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
