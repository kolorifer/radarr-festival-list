name: Enrich audience cap calibration
on:
  push:
    branches: [research/audience-cap-calibration]
    paths:
      - audience_calibration_enrichment.py
      - audience_cap_simulation.py
      - .github/workflows/audience-cap-enrichment.yml
permissions:
  contents: write
concurrency:
  group: audience-cap-enrichment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Retry the one transient ReelDB failure privately
        env:
          REELDB_API_KEY: ${{ secrets.REELDB_API_KEY }}
        run: python audience_calibration_enrichment.py --reeldb --max-requests 2 --only-id tt23770030
      - name: Fill missing IMDb data from the official dataset
        run: python audience_calibration_enrichment.py --imdb
      - name: Generate both research variants and comparison artifacts
        run: python audience_cap_simulation.py
      - name: Commit research data and outputs
        run: |
          git add audience-ratings.json simulations/audience-cap-comparison
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git commit -m "Generate audience 150 and 200 calibration artifacts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
