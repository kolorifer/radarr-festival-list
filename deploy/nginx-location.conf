# Merge into the existing HTTPS server only if you control its configuration.
# A provider-managed route must provide equivalent prefix stripping/log controls.
# Change /movie-intel/ to the actual path and set PUBLIC_BASE_URL accordingly.
location /movie-intel/ {
    proxy_pass http://127.0.0.1:40714/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
    # Webhook paths and action tokens are credentials. Do not log these paths.
    access_log off;
    error_log /dev/null;
}
